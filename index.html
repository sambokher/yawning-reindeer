<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris - Candy Glass Edition</title>
  <style>
    body {
      background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      display: flex;
      gap: 30px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    canvas {
      border: 4px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      height: 400px;
      width: 240px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    #stats {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 140px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.08);
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .stat-label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    #start-btn {
      padding: 15px;
      cursor: pointer;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(79, 172, 254, 0.5);
    }

    #start-btn:active {
      transform: translateY(0);
    }

    #controls-hint {
      margin-top: 30px;
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      text-align: center;
    }

    kbd {
      background: rgba(255,255,255,0.1);
      padding: 3px 8px;
      border-radius: 6px;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      margin: 0 2px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="tetris" width="240" height="400"></canvas>
    
    <div id="stats">
      <div>
        <div class="stat-box">
          <div class="stat-label">Score</div>
          <div id="score" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Lines</div>
          <div id="lines" class="stat-value">0</div>
        </div>
      </div>
      <button id="start-btn">Restart</button>
    </div>
  </div>

  <div id="controls-hint">
    Use <kbd>←</kbd> <kbd>→</kbd> to move, <kbd>↑</kbd> to rotate, <kbd>↓</kbd> to drop faster
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const linesElement = document.getElementById('lines');

    context.scale(20, 20);

    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) {
                    continue outer;
                }
            }

            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;

            player.score += rowCount * 10;
            player.lines += 1;
            rowCount *= 2;
        }
        updateScore();
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    function createPiece(type) {
        if (type === 'I') {
            return [
                [0, 1, 0, 0],
                [0, 1, 0, 0],
                [0, 1, 0, 0],
                [0, 1, 0, 0],
            ];
        } else if (type === 'L') {
            return [
                [0, 2, 0],
                [0, 2, 0],
                [0, 2, 2],
            ];
        } else if (type === 'J') {
            return [
                [0, 3, 0],
                [0, 3, 0],
                [3, 3, 0],
            ];
        } else if (type === 'O') {
            return [
                [4, 4],
                [4, 4],
            ];
        } else if (type === 'Z') {
            return [
                [5, 5, 0],
                [0, 5, 5],
                [0, 0, 0],
            ];
        } else if (type === 'S') {
            return [
                [0, 6, 6],
                [6, 6, 0],
                [0, 0, 0],
            ];
        } else if (type === 'T') {
            return [
                [0, 7, 0],
                [7, 7, 7],
                [0, 0, 0],
            ];
        }
    }

    function draw() {
        context.clearRect(0, 0, canvas.width, canvas.height);

        drawMatrix(arena, {x: 0, y: 0});
        drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(matrix, offset) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    const drawX = x + offset.x;
                    const drawY = y + offset.y;
                    
                    // Main block body
                    context.fillStyle = colors[value];
                    context.fillRect(drawX, drawY, 1, 1);

                    // Glossy highlight (top and left edges)
                    context.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    context.fillRect(drawX, drawY, 1, 0.1);
                    context.fillRect(drawX, drawY, 0.1, 1);

                    // Shadow (bottom and right edges)
                    context.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    context.fillRect(drawX, drawY + 0.9, 1, 0.1);
                    context.fillRect(drawX + 0.9, drawY, 0.1, 1);

                    // Glint spot
                    context.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    context.fillRect(drawX + 0.2, drawY + 0.2, 0.2, 0.2);
                }
            });
        });
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
        }
        dropCounter = 0;
    }

    function playerMove(offset) {
        player.pos.x += offset;
        if (collide(arena, player)) {
            player.pos.x -= offset;
        }
    }

    function playerReset() {
        const pieces = 'TJLOSZI';
        player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) -
                       (player.matrix[0].length / 2 | 0);
        if (collide(arena, player)) {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            updateScore();
        }
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    let dropCounter = 0;
    let dropInterval = 1000;

    let lastTime = 0;
    function update(time = 0) {
        const deltaTime = time - lastTime;

        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop();
        }

        lastTime = time;

        draw();
        requestAnimationFrame(update);
    }

    function updateScore() {
        scoreElement.innerText = player.score;
        linesElement.innerText = player.lines;
    }

    const colors = [
        null,
        '#ff4d6d', // I - Pink Cherry
        '#00d2ff', // L - Sky Blue
        '#3a86ff', // J - Royal Blue
        '#fbff12', // O - Neon Yellow
        '#ff9f1c', // Z - Orange
        '#2ec4b6', // S - Teal
        '#9b5de5', // T - Grape
    ];

    const arena = createMatrix(12, 20);

    const player = {
        pos: {x: 0, y: 0},
        matrix: null,
        score: 0,
        lines: 0,
    };

    document.addEventListener('keydown', event => {
        if (event.keyCode === 37) {
            playerMove(-1);
        } else if (event.keyCode === 39) {
            playerMove(1);
        } else if (event.keyCode === 40) {
            playerDrop();
        } else if (event.keyCode === 38) {
            playerRotate(1);
        }
    });

    document.getElementById('start-btn').addEventListener('click', () => {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        player.lines = 0;
        updateScore();
        playerReset();
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
